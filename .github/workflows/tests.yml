name: Tests

# Issue #41: run JVM unit tests and the Docker-backed fixture checks. (The
# Testcontainers integration graph this workflow used to run was removed with
# the modules it covered; the surviving one lives in app2.yml.)
# Issue #816/#953: PRs run the cheap merge gate; Docker/emulator validation is
# batched on main pushes or manual dispatch so every trivial/independent PR does
# not sit in the heavy runner queue. The main-push concurrency group cancels
# older in-flight runs when newer merges land, so the newest main commit becomes
# the current batch head. APK builds stay on the tag-only trigger in build.yml.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "chat/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "chat/**"
  workflow_dispatch:
  schedule: [{cron: "0 0,8,16 * * *"}]

concurrency:
  group: ${{ github.event_name=='schedule'&&'sched'||format('{0}-{1}',github.workflow,github.event_name=='pull_request'&&format('pr-{0}',github.event.pull_request.number)||format('ref-{0}',github.ref)) }}
  cancel-in-progress: ${{ github.event_name!='schedule' }}

jobs:
  # Issue #2060 (CI Phase A): the ~25 SERIAL guard steps this job used to carry in
  # front of the Gradle run (~20 min unrelated to the tests) now run CONCURRENTLY
  # in `guards-static`, `guards-ci-harness` and `dex`, all still blocking through
  # `unit-gate` below. Issue #2067 added `guards-test-selection` on the same
  # principle, for #2063's coverage guards.
  #
  # Issue #2069 (CI Phase B): after that, ONE Gradle step WAS the whole critical
  # path (18m04s) and --max-workers 2->4 bought 57s. Sharded by variant: the
  # union of the two legs is exactly the old `./gradlew test` graph. Rationale +
  # the coverage-invariant proof: scripts/check-ci-unit-forced-execution.sh and
  # the shard partition check in scripts/check-executed-test-counts.sh.
  unit:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Issue #1897: the #1646 result guard correctly rejects FROM-CACHE test
      # tasks, but it cannot force the preceding Gradle invocation to execute.
      # Keep the required Unit command aligned with the canonical forced local
      # gate: rerun every task and disable cache restoration. The cheap
      # self-test proves this wiring guard fails closed when either flag is
      # removed, duplicated, contradicted, or moved off the complete test graph.
      - name: CI Unit forced-execution wiring guard (issue #1897)
        run: |
          chmod +x scripts/check-ci-unit-forced-execution.py
          scripts/check-ci-unit-forced-execution.py --self-test
          scripts/check-ci-unit-forced-execution.py

      # Issue #1646: the executed-test-count guard's OWN red->green self-test.
      # Proves — with synthetic result XML + synthetic Gradle console output, no
      # Gradle, no Android SDK, no emulator — that the guard FAILS a vacuous run
      # (missing task / UP-TO-DATE / FROM-CACHE / all-skipped / below-floor) and
      # PASSES a genuine one, and that NO-SOURCE on a genuinely test-free module
      # does not trip it. Runs BEFORE the Gradle step so a broken guard is caught
      # in seconds, not 20 minutes in. The self-test asserts its own check count,
      # so the anti-vacuous-test guard cannot itself pass vacuously.
      - name: Executed-test-count guard self-test (issue #1646)
        run: |
          chmod +x scripts/check-executed-test-counts.sh
          scripts/check-executed-test-counts.sh --self-test

      # Issue #1646: mark the start of the test run. Any TEST-*.xml older than
      # this marker is a leftover from an earlier run whose task was skipped as
      # UP-TO-DATE, not evidence from THIS run.
      - name: Mark test-run start (issue #1646)
        run: |
          touch "${RUNNER_TEMP}/unit-test-run-start"

      # Issues #760/#2060/#2069: why --max-workers=4 and the capped heaps, why
      # `--parallel`/`maxParallelForks` are deliberately absent, and the measured
      # cost of each knob — docs/testing.md "CI Unit lane: sizing and sharding".
      #
      # Issue #1646: tee the console to a log (--console=plain) so the count
      # guard below can see which test tasks actually EXECUTED vs came back
      # UP-TO-DATE / FROM-CACHE / NO-SOURCE. pipefail keeps Gradle's exit code
      # authoritative through the tee.
      - name: Run JVM unit tests
        id: unit_tests
        timeout-minutes: 35
        run: |
          set -o pipefail
          ./gradlew "test${{ matrix.variant }}UnitTest" \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee "${RUNNER_TEMP}/unit-test-gradle.log"

      # Issue #1646: a green Gradle run that executed ZERO tests is not evidence.
      # Gradle prints test counts ONLY on failure, so before this step a green
      # run had no log line and no artifact proving any test ran. Parse the
      # result XML, hard-fail any expected test task that executed 0 tests (or
      # fell below its floor), and ECHO the per-task counts into the job log and
      # the job summary so a human/agent certifying a PR can read them without
      # downloading an artifact.
      #
      # Runs whenever the test step itself ran — on GREEN (the point of the
      # issue) and on RED alike, since "killed mid-run but reported exit 0"
      # (incident 3) is a case where the count is the only thing that exposes the
      # truth. Scoped to the test step's own conclusion rather than a bare
      # always() so an earlier guard failing (Gradle never ran, no log written)
      # does not add a confusing second red about a missing log file.
      - name: Assert tests actually executed (issue #1646)
        if: always() && steps.unit_tests.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-executed-test-counts.sh
          scripts/check-executed-test-counts.sh \
            --variant "${{ matrix.variant }}" \
            --newer-than "${RUNNER_TEMP}/unit-test-run-start" \
            --gradle-log "${RUNNER_TEMP}/unit-test-gradle.log"

      # Issue #2082: restore the rolling executed-classes ledger, credit this
      # run's JUnit XML, check current-run attendance, verify unit classes.
      # Cache save is the post step of Restore; an absent ledger never looks
      # like a passing verify (the wrapper fail-closes).
      - name: Restore test-execution ledger (#2082)
        if: always() && steps.unit_tests.conclusion != 'skipped'
        uses: actions/cache@v5
        with:
          path: build/test-execution-ledger.tsv
          key: test-execution-ledger-${{ runner.os }}-${{ github.sha }}-unit-${{ matrix.variant }}-${{ github.run_attempt }}
          restore-keys: |
            test-execution-ledger-${{ runner.os }}-

      - name: Record and verify unit execution ledger (#2082)
        if: always() && steps.unit_tests.conclusion != 'skipped'
        run: |
          chmod +x scripts/ci-record-test-execution-ledger.sh scripts/check-test-execution-ledger.sh
          scripts/ci-record-test-execution-ledger.sh \
            --tier "unit-${{ matrix.variant }}" \
            --variant "${{ matrix.variant }}" \
            --newer-than "${RUNNER_TEMP}/unit-test-run-start"

      # Issue #1646: upload ALWAYS, not just on failure. A green run's result XML
      # IS the evidence that the run was real; throwing it away and keeping only
      # failures is precisely why CI could not prove a green run executed
      # anything.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ matrix.variant }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/test-execution-ledger.tsv
            build/test-execution-attendance.tsv
          # Issue #1809: a re-run of this job replaces its OWN attempt's upload
          # instead of hitting a duplicate-name failure; the previous attempt's
          # artifact is in a different scope and is left intact.
          overwrite: true
          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # Issue #2060 (CI Phase A): static source-tree guards, split out of the `unit`
  # job so they run in PARALLEL with the Gradle test graph instead of in front of
  # it. Every guard is byte-identical to the step it replaced — same script, same
  # self-test, same failure semantics — and still blocking, since `unit-gate`
  # (named `Unit tests`) fails if this job fails. No Gradle, so no Gradle cache.
  guards-static:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The #2094 Docker-integration forced-execution guard was DELETED with the
      # four-task graph it pinned (the old app, core-ssh, core-portfwd and
      # core-tmux integrationTest tasks — every one of those modules was removed
      # by the rewrite's hard cut). The surviving Docker integration lane is
      # core-transport's, in .github/workflows/app2.yml
      # (job `transport-integration`), which carries its own anti-vacuous-green
      # guard (scripts/check-app2-lane-execution.py: fresh-run marker,
      # executed = tests - skipped, per-lane floor). D22: no shim kept here.

      # Issue #1766: render PNGs are direct test side effects, so Gradle can
      # otherwise return FROM-CACHE/UP-TO-DATE for a second, differently
      # filtered DesignRenders method without creating its PNG. This fake-Gradle
      # self-test deterministically proves sequential filters, source mapping
      # validation, and invocation-fresh artifact checks without launching
      # Gradle or Roborazzi.
      - name: Render harness freshness self-test (issue #1766)
        run: |
          chmod +x scripts/render.sh scripts/render-selftest.sh
          scripts/render-selftest.sh

      # Issue #657/#1857 (F4): test-validity guard. Flags the highest-signal
      # test anti-patterns the #657 audit catalogued — chiefly an IME/keyboard/
      # geometry assertion gated behind an `assumeTrue(...)` self-skip, which on
      # the CI swiftshader AVD silently does NOT run (the real soft IME often
      # never raises), so the test passes vacuously and an on-device regression
      # ships green. The guard hard-fails ONLY on a NEW unjustified occurrence
      # (a small baseline allowlists the catalogued-but-not-yet-rewritten cases,
      # and an inline `// JUSTIFIED:` comment opts a legitimate non-IME guard
      # out), so it adds protection without reddening CI for tests it is not its
      # job to fix. Runs in `guards-static`, alongside rather than in front of the
      # Gradle test step (#2060). This is the machine backstop
      # for the process.md "Regression-proof validity rules" (F2/F3) so the rule
      # does not rely solely on reviewer memory. Additive — it does not touch the
      # existing Unit/Python/Integration/emulator jobs. The guard now also carries
      # the #1430 SEAM1 detector (unvetted connected-test state-injection seams —
      # the #1158 forceActivePaneAltBufferForTest cheat class), and its self-test
      # (below) plants a synthetic cheat + a vetted counterpart to prove SEAM1
      # (and the other detectors) still fire red / stay green each push. The
      # #1857 A5L self-test also plants a topic-independent
      # assumeTrue("x", false) mutant plus legal block/newline-comment callee
      # trivia, so literal-boolean self-skips cannot hide behind the older
      # IME/keyboard vocabulary filter or raw-source call formatting.
      #
      # Issue #2060 — COST NOTE. ~281 s on CI, and "it grew a full-tree scan,
      # scope it" is the WRONG diagnosis: one real-tree pass is ~30 s; the bulk is
      # the SELF-TEST re-running the guard once per planted fixture state (#1430
      # already memoized ~30 runs to ~1 per state), so cutting it deletes detector
      # coverage. The cost stays and moves off the critical path instead.
      - name: Test-validity guard (issue #657/#848/#1048/#1154/#1430/#1857)
        run: |
          chmod +x scripts/check-test-validity.sh scripts/check-test-validity-selftest.sh
          scripts/check-test-validity.sh
          scripts/check-test-validity-selftest.sh

      # Issue #1853: the quieter sibling of the vacuous green. check-test-validity
      # asks whether a test that RUNS asserts anything real; this asks whether it
      # runs at all. Twelve harnesses under tests/scripts/ were referenced by no
      # workflow, Gradle task, script, or doc — they had never executed once, and
      # four were already broken when finally run. Every tracked file under tests/
      # must now be reachable from outside tests/, or transitively from a
      # reachable test asset (compose -> Dockerfile -> entrypoint -> fixture).
      # No allowlist: wire it into a gate, or delete it (D22). The self-test
      # plants a dead fixture and proves the guard still goes red. Cheap, no
      # emulator, no Docker.
      - name: "Unreferenced-test-asset guard (issue #1853)"
        run: |
          chmod +x scripts/check-tests-referenced.sh
          scripts/check-tests-referenced.sh --self-test
          scripts/check-tests-referenced.sh

      # Issue #1678/#1751/#2141: per-push mutation self-test for the nightly
      # exact-method guards. Rationale lives in the script (this workflow is at
      # its file-size-hygiene cap, so the comments move with the code).
      - name: "Nightly exact-method guard self-test (issue #1678/#1751)"
        run: bash scripts/run-nightly-guard-selftests.sh

      # Issue #1355: MainDispatcherRule owns the global Dispatchers.Main reset.
      # Any standalone TmuxSessionViewModel test that leaves an unregistered VM
      # can race that reset from a still-unwinding coroutine and fail an
      # unrelated next class at TestMainDispatcher.kt:72. Keep constructor
      # registration structural and prove the guard itself goes red.
      - name: Main-dispatcher VM teardown guard (issue #1355)
        run: |
          chmod +x scripts/check-main-dispatcher-vm-teardown.sh
          scripts/check-main-dispatcher-vm-teardown.sh
          scripts/check-main-dispatcher-vm-teardown.sh --self-test

      # The #848 CI journey-harness guard was DELETED with the per-class journey
      # registry it validated (scripts/ci-journey-suite.sh). It answered "is this
      # androidTest class named in the explicit FQCN allowlist, and does it use the
      # launch-owned MainActivity harness?" — the first half is meaningless under
      # issue #2474 (app2's lane runs its module's whole instrumented set
      # unfiltered, so nothing CAN be unwired), and the second half died with the
      # com.pocketshell.app.proof classes it inspected. The surviving property —
      # a journey-shaped androidTest class must live where the wholesale lane runs
      # it — moved into scripts/check-test-validity.sh's J1 detector, which now
      # derives that root from the suite rather than parsing a list.

      - name: Raw-component drift guard (issue #865)
        run: |
          chmod +x scripts/check-component-drift.sh
          scripts/check-component-drift.sh --self-test
          scripts/check-component-drift.sh

      # Issue #901: design-token (radius/font-size) ladder guardrail. Sibling of
      # the #865 component-drift guard: this fast static grep PINS a per-file
      # baseline of off-ladder `RoundedCornerShape(<N>.dp)` / `fontSize = <N>.sp`
      # literals (the #461/Slice-D type+radius ladder: 8/14/20/28 radii,
      # 11/13/14/16/20 sizes) and FAILS only when a file gains a NEW off-ladder
      # literal (or a new file ships with any). The script existed but was never
      # wired in, so the Conversation view silently drifted to hardcoded 4/6.dp
      # radii and 10/12.sp text undetected. Cheap (< 1 s grep), no emulator —
      # runs in the parallel `guards-static` job (#2060). Re-baseline with
      # `scripts/check-design-tokens.sh --update` after a screen migrates.
      - name: Design-token ladder guard (issue #901)
        run: |
          chmod +x scripts/check-design-tokens.sh
          scripts/check-design-tokens.sh

      # Downward-only 128 KiB ratchet; shrink files instead of raising its baseline.
      - name: Oversized-file hygiene guard
        run: |
          chmod +x scripts/check-file-size-hygiene.sh
          scripts/check-file-size-hygiene.sh --self-test
          scripts/check-file-size-hygiene.sh

      # The #1047/#1324 connection-VM ratchet was DELETED with its subject
      # (D22, no shim). All three of its checks were scoped to the ONE file
      # app/src/main/java/com/pocketshell/app/tmux/TmuxSessionViewModel.kt — no
      # new Dispatchers.IO/runBlocking in it, a frozen `ConnectionDecision`
      # variant count, and a no-growth line cap on it — and the rewrite's hard
      # cut removed that file, the `ConnectionDecision` hierarchy and the whole
      # module. A downward-only ratchet whose target reached zero has nothing
      # left to ratchet; it was failing closed on "missing VM file" every run.
      # app2's connection core (next/terminal/SessionViewModel.kt,
      # ReconnectController.kt, GraceCoordinator.kt) has NO ratchet of its own
      # yet — deliberately not invented here, because picking its baselines and
      # its G-B analogue is a D28 design call, not a mechanical repoint.

      # Issue #1724: the hosted release-confidence gate reproducibly exhausted
      # the Kotlin compiler heap before any journey ran because debug + release
      # compilation shared a 2 GiB daemon concurrently. Pin the hosted-only
      # single-worker / split-heap budget, and prove the guard rejects renewed
      # parallelism or either missing heap bound.
      - name: Release-emulator compiler-memory guard (issue #1724)
        run: |
          chmod +x scripts/check-release-emulator-memory-budget.sh
          scripts/check-release-emulator-memory-budget.sh --self-test
          scripts/check-release-emulator-memory-budget.sh

      # Issue #2054: keeps every release-chain Gradle build on the shared
      # heap-bounded profile after the v0.4.42 validation OOMed three times in
      # the BUILD. `--self-test` mutates real script copies and requires a RED
      # for each; it also re-runs its whole body under both `CI` shapes because
      # the >=20G floor is CI-exempt. Rationale, the exact property enforced and
      # its residual gaps live in ONE place — the header of
      # scripts/check-release-gate-execution-profile.sh. Do not restate them
      # here; a copy only drifts.
      - name: Release-gate execution-profile guard (issue #2054)
        run: |
          chmod +x scripts/check-release-gate-execution-profile.sh
          scripts/check-release-gate-execution-profile.sh --self-test
          scripts/check-release-gate-execution-profile.sh

      # Issue #2379 / decision D37: the nightly fault-injection release gate has
      # no off switch — not the deleted names (C1/C2/C3), and nothing injectable
      # through the environment on the release path (C4). Waiving it was routine
      # (v0.4.31-v0.4.38, v0.4.45) and #1671 traced the #1610 reconnect storm
      # reaching the maintainer to exactly that. Rationale: the script header
      # and docs/release.md; don't restate it here.
      - name: "Release-gate bypass guard (issue #2379, D37)"
        run: |
          chmod +x scripts/check-release-gate-bypass-absent.sh
          scripts/check-release-gate-bypass-absent.sh --self-test
          scripts/check-release-gate-bypass-absent.sh

      # Issue #2064: fail-closed proofs for one gate-built APK pair, exact-SHA
      # sharded CI evidence reuse, and measured/provenance-rich summaries.
      - name: Release identity and evidence guards (issue #2064)
        run: bash scripts/run-release-evidence-guards.sh

      # Issue #1761: the local forced full-JVM gate hit Kotlin compiler OOM when
      # Worker API sessions overlapped inside the 8 GiB scope. Keep its complete
      # `test --rerun-tasks` graph on the proven single-worker / split-heap
      # profile, and reject missing, duplicated, or conflicting resource flags.
      # The 119-check direct / 118-check authenticated nested fake matrix also
      # proves local/GitHub Android SDK discovery, fail-closed invalid roots,
      # and stripping of hosted toolchain/profile variables before the guard.
      - name: Forced full-JVM resource-profile guard (issue #1761)
        run: |
          scripts/full-jvm-gate.py --profile-guard-self-test
          scripts/full-jvm-gate.py --profile-guard-check

      # Issue #2066: extension/shebang disagreement, and any caller that shells
      # a non-shell program. Rationale and the exact rules live in ONE place —
      # the script header. ~2 s, no Gradle.
      - name: "Script interpreter hygiene guard (issue #2066)"
        run: |
          scripts/check-script-interpreter-hygiene.sh --self-test
          scripts/check-script-interpreter-hygiene.sh

      - name: "androidTest compile-wiring guard (issues #1720, #2117)"
        run: scripts/check-androidtest-compile-wiring.sh --self-test && scripts/check-androidtest-compile-wiring.sh

      # Issue #1932: curated production-binding mutation harness. The cheap Unit
      # half proves the harness can still go red and that every manifest target
      # still exists. The mutants themselves run on nightly (`--run`), not here.
      - name: "Production-binding mutation harness (issue #1932)"
        run: |
          scripts/check-production-binding-mutations.py --self-test
          scripts/check-production-binding-mutations.py --check-sites

      # Issue #2252: an invalid nightly workflow can create a failed push run
      # with zero jobs and no log. Keep the YAML, trigger contract, and
      # release-gating fault-verdict wiring under the per-push static guard.
      - name: "Nightly workflow integrity guard (issue #2252)"
        run: |
          chmod +x scripts/check-nightly-workflow.sh scripts/check-emulator-action-pin.sh
          scripts/check-nightly-workflow.sh --self-test
          scripts/check-nightly-workflow.sh
          scripts/check-emulator-action-pin.sh --self-test
          scripts/check-emulator-action-pin.sh

      # #2067 keeps unit-gate's needs/result lists aligned; the final grep keeps
      # #1956's executable lifecycle harness wired into guards-harness.
      - name: "Unit-gate wiring guard (issue #2067)"
        run: |
          chmod +x scripts/check-unit-gate-wiring.sh
          scripts/check-unit-gate-wiring.sh --self-test
          scripts/check-unit-gate-wiring.sh
          grep -Fqx '      - run: scripts/test-full-jvm-gate-detached.sh' .github/workflows/tests.yml

  # ---------------------------------------------------------------------------
  # Issue #2060 (CI Phase A): CI/harness fixture guards, split out of the `unit`
  # job. They drive the real emulator-journey / nightly / release harness scripts
  # against stubbed gradle/adb/docker. Several are intentionally WALL-CLOCK bound
  # (the journey-budget harness modelled timeouts/wedges/stalls with real
  # `sleep`s — a kernel timer is the only host-throughput-independent way to
  # prove a timeout fires), so stop paying that on the critical path rather than
  # shortening the sleeps. Same contract as `guards-static`.
  guards-ci-harness:
    name: CI harness guards
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Issue #835: gate the emulator-journey suite's OWN budget/labelling logic
      # so the #470-stall hardening cannot silently regress. This is a fast
      # JVM-free shell test (stubbed gradle/adb, tiny budget) proving the suite
      # bails CLEANLY at its deadline, ALWAYS writes summary.md, marks it with
      # the distinct JOURNEY_STEP_TIMEOUT label, exits red, and (issue #835
      # REOPENED, the DURABLE GUARD) that the workflow classifier now routes that
      # summary to a HARD-RED timeout verdict — NOT advisory-green and NOT the
      # #771 EMULATOR INFRA UNAVAILABLE branch — so a cut-short load-bearing class
      # can never again be masked. No emulator, no JVM, no Gradle.
      #
      # Issue #2060 — COST CORRECTION. "Cheap (< 15 s)" had long been untrue: it
      # is ~286 s on CI, the priciest step in the old serial Unit job after the
      # dex assemble. NOT scan bloat to optimise away — it proves TIMEOUT
      # behaviour, and the only host-throughput-independent way to fire a timeout
      # is a kernel timer, so its ~20 `sleep`s ARE the proof. Structural fix: it
      # now overlaps the Gradle graph in parallel.
      - name: Two-phase Android process-restart harness guard (issue #2264)
        run: |
          chmod +x scripts/two-phase-android-instrumentation.sh \
            scripts/test-two-phase-android-instrumentation.sh \
            scripts/two-phase-android-mutation.sh
          scripts/test-two-phase-android-instrumentation.sh

      # Issue #1876 round 2: GitHub checks the committed Docker test key out as
      # 0644, and OpenSSH rejects it before the mobile-RTT journey can start.
      # Drive the workflow's real readiness block from that checkout mode and
      # require owner-only permissions before its first SSH auth proof. Fast,
      # JVM-free, Docker-free, and emulator-free (docker/ssh are stubbed).
      - name: "Agents-pool lane isolation guard (issue #1842)"
        run: |
          chmod +x scripts/test-agents-pool-isolation.sh
          scripts/test-agents-pool-isolation.sh

      # Issue #2128: --pool promised a distinct (emulator, agents-port) claim
      # but NetworkFaultProofBase hard-coded 2222/2228 and Toxiproxy upstream
      # agents:22, so fault-class lanes stayed pinned to the shared fixture
      # and siblings wiped it mid-run (empty session list). Fast, JVM-free,
      # no docker daemon: proves the pin is gone, two pool lanes get disjoint
      # fault ports, compose is parameterized, and a wiped proxy is rc 90
      # with a banner that cannot be read as a product failure.
      - name: "Network-fault pool isolation guard (issue #2128)"
        run: |
          chmod +x scripts/test-network-fault-pool-isolation.sh
          scripts/test-network-fault-pool-isolation.sh

      # Issue #2143 (rationale + case list in the script header). Fast, stubbed:
      # no JVM, no Docker, no emulator.
      - name: "Shared SSH/tmux fixture health guard (issue #2143)"
        run: chmod +x scripts/test-ci-journey-fixture-health.sh && scripts/test-ci-journey-fixture-health.sh

      # Issue #2007: connected-test.sh and full-jvm-gate.py are both canonical
      # wrappers around ./gradlew and both rewrite the SAME app/build graph of
      # the checkout they run from. Nothing stopped them overlapping, so during
      # #893 validation a connected --rerun-tasks build and the full JVM gate
      # ran at once and the gate died in 1m41s on a missing
      # processDebugResources/R.jar -- before a single test. Like #1842 that is
      # worse than a flake: the failure lands in whichever lane LOST the race and
      # reads as a product/test defect, so the gate had to be discarded as
      # evidence. This harness drives the REAL wrappers with stubbed
      # gradlew/adb/systemctl and sandboxed lock anchors: two lanes in one
      # worktree (on DISTINCT stub emulators, so the per-serial AVD lock
      # deliberately does not serialise them) must reach a peak of exactly ONE
      # live builder, distinct worktrees and #724 pool lanes must stay
      # concurrent, the Bash and Python halves of the lock must resolve one file,
      # and a blocked run must name the owner and exit 75 without building.
      # It also pins the crash and ordering contracts that a lock can silently
      # get wrong: a SIGKILLed wrapper (what run_bounded does on the --no-pool
      # path) must leave NO orphaned holder wedging the tree for the default
      # 7200s, the contention diagnostic must name the live flock holder as well
      # as the wrapper to stop, and a lane queuing for the tree must not be
      # sitting on the box's emulator serial -- checked at BOTH serial-claim
      # sites (a caller-preset ANDROID_SERIAL and the default path where
      # connected-test.sh allocates its own), because a guard covering only the
      # preset one stays green while the acquire is moved after the allocator.
      # Fast (< 90 s), JVM-free, no emulator, no Docker.
      - name: "Gradle output-tree lock guard (issue #2007)"
        run: |
          chmod +x scripts/test-gradle-output-lock.sh
          scripts/test-gradle-output-lock.sh

      - run: scripts/test-full-jvm-gate-detached.sh

      # Issue #1937 recurrence: ubuntu-latest does not guarantee ripgrep. Run
      # the real guard under a minimal no-rg PATH and prove it still discovers
      # both a valid consumer and a dynamically added broken fourth consumer.
      - name: "Shared tmux-wrapper discovery self-test (issue #1937)"
        run: |
          chmod +x scripts/test-shared-tmux-wrapper-fixtures.sh \
            scripts/test-shared-tmux-wrapper-fixtures-selftest.sh
          scripts/test-shared-tmux-wrapper-fixtures-selftest.sh

      # Issue #2060: the #1876/#1458 guards and the #835 balance cap derive the
      # shard count from the matrix via this helper instead of pinning a literal,
      # so 3 -> 6 cannot silently orphan a hash bucket no shard selects. They are
      # only as good as the helper, so prove it fails closed. The second is the
      # downward-only ratchet: it reddens when a journey-CI guard grows a
      # hardcoded shard total in one of three known shapes. (< 2 s)
      - name: Nightly validated-RC marker guards (issues #2356, #2374, #2430)
        run: |
          scripts/test-ci-nightly-rc-mark.sh
          scripts/test-ci-nightly-rc-consecutive-check.sh
          scripts/test-ci-nightly-rc-issue.sh
          bash scripts/test-release-validation-provenance.sh --self-test
          bash scripts/test-release-validation-provenance.sh

      # #2237's full mutation is review evidence; its cheap anchor/test-name
      # validation belongs in the live harness lane so it cannot silently rot.
      - name: Stale-dismiss mutation structural guard (issue #2237)
        run: bash scripts/check-issue2237-stale-dismiss-mutation.sh --check

      # Issues #1800/#1919: the failure-SIGNATURE classifier that types the CI
      # swiftshader "real system input-method window never became visible"
      # PRECONDITION as INFRA (-> RE-RUN) while keeping every genuine journey
      # assertion failure — including a containment/anchor failure in the SAME
      # class — hard RED. Drives the real classifier + the real aggregate
      # reducer over fixture artifacts so BOTH outcomes are observed, and pins
      # the measured cold-boot retry-cost model against the observed shard-0
      # numbers from run 30305256109, plus strict attempt-local ProcessRecord
      # ownership for foreign framework ANRs. Cheap (< 15 s), no emulator.
      - name: "Unreferenced release/AVD harnesses (issue #1853)"
        run: |
          set -euo pipefail
          for t in tests/scripts/app-version-test.sh \
                   tests/scripts/avd-lock-sharing-test.sh \
                   tests/scripts/avd-lock-test.sh \
                   tests/scripts/avd-pool-test.sh \
                   tests/scripts/disk-preflight-test.sh \
                   tests/scripts/gate-isolated-copy-version-test.sh \
                   tests/scripts/long-running-release-gate-retry-test.sh \
                   tests/scripts/phone-walkthrough-dispatch-test.sh \
                   tests/scripts/pre-release-emulator-readiness-test.sh \
                   tests/scripts/pre-release-gate-retry-test.sh \
                   tests/scripts/pre-release-version-test.sh \
                   tests/scripts/reconnect-app-switch-test.sh \
                   tests/scripts/release-gate-retry-test.sh \
                   tests/scripts/release-validation-storage-test.sh \
                   tests/scripts/start-local-avd-test.sh \
                   tests/scripts/terminal-workbench-retry-test.sh \
                   tests/scripts/update-install-helper-test.sh \
                   tests/scripts/walkthrough-visual-retry-test.sh; do
            echo "== $t"
            bash "$t"
          done

      - name: Build NDK-retry and assemble-debug profile guards (#1581)
        run: |
          chmod +x scripts/ci-build-profile-guards.sh
          scripts/ci-build-profile-guards.sh

      - run: scripts/test-ci-cadence.sh

  # ---------------------------------------------------------------------------
  # Issue #2067: the #2063 test-area coverage guards, as a DEDICATED job. Reached
  # through a JVM test they were paid TWICE per push (both variants) on the Unit
  # critical path for work that compiles nothing, which cancelled the scheme's
  # own saving; here they are paid once, in parallel, still blocking through
  # `unit-gate`. The JVM driver is deleted, not duplicated (D22). No
  # JDK/Gradle/SDK/Docker, so a depth-1 checkout is the whole setup, and
  # `timeout-minutes` is a hang guard rather than the budget (the suite's wall
  # clock varies 33% run to run, so the script reports its seconds instead of
  # asserting them). Rationale: scripts/ci-test-selection-guards.sh, docs/testing.md.
  guards-test-selection:
    name: Test-selection coverage guards
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Issue #2070: the host-CLI vocabulary guard imports cli.py and asks its
      # live Click Group for list_commands(). Install only the dependency needed
      # at import time; the pinned quse backend is invoked later at runtime and
      # is deliberately not part of this filesystem-only guard job.
      - name: Set up Python 3.11 (issue #2070)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install live Click reader dependency (issue #2070)
        run: python3 -m pip install --disable-pip-version-check "click>=8.2.0"

      - name: "Run the #2063 test-area coverage guards"
        run: |
          chmod +x scripts/ci-test-selection-guards.sh
          scripts/ci-test-selection-guards.sh

  # ---------------------------------------------------------------------------
  # Issue #2060 (CI Phase A): split out of the `unit` job so the ONE step that
  # compiles anything runs off the Unit critical path, and so the workflow gets a
  # cheap "the tree compiles" signal early, which is what `emulator-journey` gates
  # on (see its `needs:` note).
  #
  # The job's original payload — the #1685 dex register-pressure ratchet over the
  # old app module's debug APK — was DELETED with that module (rewrite hard cut);
  # it gated `com.pocketshell.app.tmux.TmuxSessionScreen`, which no longer exists
  # and has no app2 successor. The job KEEPS its key and display name because
  # both are load-bearing outside this file (unit-gate's needs/env/loop,
  # scripts/check-unit-gate-wiring.sh's self-test fixtures, scripts/watch-ci.py's
  # job list); renaming is a separate, wider change.
  dex:
    name: Dex register-pressure ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # #2356: fetch-depth 0 — below's Gradle cross-check needs real v* tags,
      # else derive-version.sh silently falls back to the dev path and the
      # guard can never catch a real regression (reviewer finding).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # #2356: Gradle half of check-version-coupling.sh (python: runs the rest).
      - name: "Version-coupling guard, Gradle cross-check (issue #2356)"
        run: |
          chmod +x scripts/check-version-coupling.sh
          scripts/check-version-coupling.sh

      # The #1685 dex register-pressure ratchet step lived here. It assembled the
      # old app module's debug APK and dexed it to keep every
      # `com.pocketshell.app.tmux.TmuxSessionScreen*` method under the 256-register
      # ART verifier cliff. Both the module and the composable were removed by the
      # rewrite's hard cut, so the Gradle command could not even configure. Deleted
      # rather than repointed: app2 has no TmuxSessionScreen equivalent yet, and
      # inventing a placeholder target would be coverage theatre (D22).
      # scripts/check-dex-register-pressure.sh is now uncalled; it is left on disk
      # for whoever re-lands an equivalent app2 screen ratchet.

      # Issues #1720/#2117. COMPILE ONLY; running stays in the emulator lane.
      # Rationale + the pinned property:
      # scripts/check-androidtest-compile-wiring.sh (guards-static).
      # The old app module's androidTest compile was dropped with that module.
      # app2's androidTest source set is compiled by its own lane
      # (.github/workflows/app2.yml, job `app2-unit`), not duplicated here.
      - name: "Compile androidTest source sets (issues #1720, #2117)"
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            :app2:compileDebugAndroidTestKotlin \
            :shared:core-terminal:compileDebugAndroidTestKotlin \
            :shared:ui-kit:compileDebugAndroidTestKotlin

  # ---------------------------------------------------------------------------
  # Issue #2060 (CI Phase A): the protected-branch required check. `main`'s
  # ruleset requires a check literally named `Unit tests`; splitting the old
  # monolithic job into several would have silently DEMOTED every guard to
  # non-blocking until someone edited the ruleset by hand — a real loss of
  # enforcement dressed up as a speed-up. This ~10-second aggregator keeps the
  # name and fails unless every unit-lane job succeeded, so the blocking
  # contract is bit-for-bit the same with zero admin action.
  #
  # `if: ${{ !cancelled() }}` (issue #2187) is load-bearing and is NOT
  # `always()`. `always()` kept this job running after the `main` push
  # concurrency group cancelled the run, and the result loop then folded
  # every `cancelled` input into a red required check — an absent result
  # rendering as a failure (runs 31950499521 / 31952697403 / 31952932366).
  # Without `always()`, GitHub does not dispatch the job on a cancelled
  # workflow and the required check concludes `cancelled`, which is what
  # `scripts/watch-ci.py` already treats as exit 4/5 rather than exit 1.
  # `always() && !cancelled()` is also wrong: GitHub evaluates it and a
  # false result is `skipped`, which a required-check ruleset can treat as
  # passing. The job still runs when a needed job failed or was skipped
  # (`!cancelled()` is not the default `success()`), so #2060 stays
  # fail-closed. A single-job cancel while the workflow continues
  # (timeout / runner death) still reaches the loop and fails closed —
  # that is not a concurrency-supersession and must not be laundered.
  # `scripts/check-unit-gate-wiring.sh` C11/C13 assert both halves.
  #
  # Issue #2067 — THIS JOB HAS THREE LISTS AND THEY MUST AGREE: `needs:`, the
  # `env:` mapping, and the loop. A job in `needs:` but not in the loop runs, can
  # go RED, and this gate stays GREEN — the silent-gate failure #2060 exists to
  # prevent; a loop entry with no `needs:` reads an empty result and is equally
  # useless. Do not hand-verify: `scripts/check-unit-gate-wiring.sh` (per push,
  # in `guards-static`) asserts it. A comment did not stop it the first time.
  unit-gate:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [unit, guards-static, guards-ci-harness, guards-test-selection, dex]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Require every unit-lane job to have succeeded
        env:
          UNIT: ${{ needs.unit.result }}
          GUARDS_STATIC: ${{ needs.guards-static.result }}
          GUARDS_CI_HARNESS: ${{ needs.guards-ci-harness.result }}
          GUARDS_TEST_SELECTION: ${{ needs.guards-test-selection.result }}
          DEX: ${{ needs.dex.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in "JVM unit tests (both shards):$UNIT" \
                      "Static guards:$GUARDS_STATIC" \
                      "CI harness guards:$GUARDS_CI_HARNESS" \
                      "Test-selection coverage guards:$GUARDS_TEST_SELECTION" \
                      "Dex register-pressure ratchet:$DEX"; do
            job="${pair%%:*}"
            result="${pair##*:}"
            printf '%-32s %s\n' "$job" "$result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if (( failed )); then
            echo "::error title=Unit lane failed::A unit-lane job did not succeed (#2060). The required \`Unit tests\` check covers all of them; open the failing job above for the diagnosis."
            exit 1
          fi
          echo "All unit-lane jobs succeeded."

  python:
    name: Python utility tests (pocketshell)
    runs-on: ubuntu-latest

    # Issue #170 (first PR): the unified `pocketshell` server-side
    # utility lives under `tools/pocketshell/` as a standalone Python
    # package. It does not participate in the Gradle build, so a separate
    # CI job exercises its pytest suite. Cheap (~5 s including install)
    # so it runs on every push without gating downstream Android jobs.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      # test_send.py drives a real tmux and hard-fails (never skips) without it (#2122).
      - name: Ensure tmux is available (issue #2122)
        run: |
          command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
          tmux -V

      - name: Verify frozen-lock CI wiring
        run: |
          bash scripts/check-python-ci-lock.sh --self-test
          bash scripts/check-python-ci-lock.sh

      - name: Install pocketshell + dev deps from the committed lock
        working-directory: tools/pocketshell
        run: uv sync --frozen --group dev

      - name: Run pytest
        working-directory: tools/pocketshell
        run: uv run --frozen pytest -v

      # Issue #2430 / audit F22: this proof used to be an uncalled top-level
      # script. It removes the missing-window production guard in a copied tree,
      # proves the affected test turns red while controls stay green, restores
      # the source, and verifies the real worktree never changed.
      - name: Usage missing-window mutation proof (issues #2274, #2430)
        env:
          POCKETSHELL_PYTHON: ${{ github.workspace }}/tools/pocketshell/.venv/bin/python
        run: bash scripts/test-usage-missing-window-mutation.sh

      # Issue #948: fail at PR time when the app `versionName`
      # (app/build.gradle.kts) and the tools/pocketshell package `version`
      # (pyproject.toml) drift. The app derives the EXPECTED host pocketshell
      # CLI version from its own versionName, so a drift makes the in-app
      # host-version banner nag the user (it happened 2026-06-25: app 0.4.16
      # vs package 0.4.14). The existing check-pypi-version.sh only runs on
      # tag push; this catches the drift at PR/push time. --self-test first
      # proves the guard's own red->green logic, then the bare run checks the
      # real tree. Cheap (~1s); kept in this cheap Python job, not the emulator
      # job.
      - name: "Version-coupling guard (issue #948, restructured for #2356)"
        run: |
          chmod +x scripts/check-version-coupling.sh
          scripts/check-version-coupling.sh --self-test
          # No JDK/SDK here; `dex` job runs the full (Gradle) check.
          scripts/check-version-coupling.sh --skip-gradle

      # #1669's "stranded release" was RETIRED by #2356 (versionName is now
      # tag-derived, no bump step to strand); check-stranded-release.sh
      # deleted (D22).

      - name: Smoke-test installed CLI
        working-directory: tools/pocketshell
        run: |
          .venv/bin/pocketshell --version
          .venv/bin/pocketshell --help
          .venv/bin/pocketshell usage --help

  sg:
    if: github.event_name=='push'
    runs-on: ubuntu-latest
    outputs:
      c: ${{steps.p.outputs.SCOPED_CLASSES}}
    steps:
      - {uses: actions/checkout@v6, with: {fetch-depth: 0}}
      - {id: p, run: "scripts/ci-plan.sh --before ${{github.event.before}}"}

  # This job used to run the four-task Testcontainers integration graph over the
  # old app, core-ssh, core-portfwd and core-tmux modules.
  # ALL FOUR modules were removed by the rewrite's hard cut, so that Gradle
  # command failed at configuration time — the job could not run at all. The
  # command, its #2094 run-marker/verify pair and its report upload are deleted
  # (D22, no shim), NOT repointed: the one surviving JVM Docker integration suite
  # is `:shared:core-transport:integrationTest`, which already has a lane in
  # .github/workflows/app2.yml (`transport-integration`) with its own execution
  # guard; duplicating it here would run it twice per push for no signal.
  #
  # What REMAINS is the part that never depended on the deleted modules: the two
  # REAL-Docker fixture smokes (#1937 tmux-wrapper images, #2143 SSH/tmux fixture
  # health). Their stubbed counterparts run per-push in `guards-ci-harness`; this
  # is the only place they are exercised against actual containers, and app2.yml
  # deliberately does not copy them. The job key and display name are kept
  # verbatim because `Integration tests (Docker)` is a named contract outside this
  # file (scripts/watch-ci.py, scripts/ci-run-jobs.sh, scripts/ci-red-issue.sh,
  # full-suite-notify.yml, tools/pocketshell tests, process.md).
  integration:
    name: Integration tests (Docker)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ubuntu-latest runners have Docker preinstalled and the daemon running,
      # which is what Testcontainers needs. Sanity-check before we hand off.
      - name: Verify Docker is available
        run: docker info

      # Issue #1937: every image that copies the shared agent-bin/tmux shim
      # must preserve Alpine's real tmux at /usr/bin/tmux.real and expose the
      # shim at /usr/bin/tmux. Build and execute every discovered consumer so
      # fixture drift fails before it can front-gate the emulator matrix.
      - name: Smoke shared tmux-wrapper fixtures
        run: scripts/test-shared-tmux-wrapper-fixtures.sh --docker

      # Issue #2143: same guard with its REAL-Docker case on, so the fix rests on
      # the fixture and not a model of it. The script brings the fixture up.
      # Quoted: an unquoted ` #2143)` is a YAML comment and truncates the name.
      - name: "Shared SSH/tmux fixture health on a REAL fixture (issue #2143)"
        run: POCKETSHELL_FIXTURE_HEALTH_REAL_DOCKER=1 scripts/test-ci-journey-fixture-health.sh
  # The `emulator-journey` and `emulator-journey-verdict` jobs were DELETED with
  # the per-class journey registry they drove (D22). Both ran
  # `scripts/ci-journey-suite.sh`, which iterated an explicit FQCN list of
  # `com.pocketshell.app.*` classes over `:app:connectedDebugAndroidTest` — the
  # module, the classes and the registry are all gone, so the jobs could not run
  # at all. Their whole sharding/retry/aggregate-verdict machinery went with
  # them (~35 scripts + ~15 harnesses).
  #
  # THE SUCCESSOR IS `.github/workflows/app2.yml`'s `app2-journey` job, and it is
  # deliberately NOT a repoint of this shape: issue #2474 runs app2's whole
  # instrumented set in ONE unfiltered instrumentation process precisely because
  # a per-class lane is what would have hidden #2477's cross-journey state
  # pollution. That job now also carries the nightly cron this file's deleted
  # sibling `nightly-extensive.yml` used to hold (decision D37).
  #
  # KNOWN GAP, deliberately not papered over: there is no per-PR journey signal
  # any more. `pr-journey-smoke.yml` provided one by running three classes out of
  # the deleted registry, and a subset is impossible under #2474's no-filter
  # rule — the only per-PR option is the whole suite, which is an emulator-budget
  # decision, not a cleanup one. `app2-journey` batches on push/schedule instead.