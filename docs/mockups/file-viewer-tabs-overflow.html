<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=412, initial-scale=1.0" />
  <title>PocketShell · File viewer tabs overflow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="standalone">
  <div class="frame">
    <div class="statusbar">
      <span>9:42</span>
      <span class="right">5G · 87%</span>
    </div>
    <div class="breadcrumb">
      <div class="back">‹</div>
      <span class="crumb current">file-09.txt</span>
      <div class="more">⋮</div>
    </div>
    <div class="file-tab-row">
      <div class="file-tab"><span class="tab-label">file-07.txt</span><span class="tab-x">×</span></div>
      <div class="file-tab"><span class="tab-label">file-08.txt</span><span class="tab-x">×</span></div>
      <div class="file-tab active"><span class="tab-label">file-09.txt</span><span class="tab-x">×</span></div>
      <div class="file-tab"><span class="tab-label">file-10.txt</span><span class="tab-x">×</span></div>
    </div>
    <div class="file-viewer-body">
      <div class="ln dim"># 12-tab workspace — active tab scrolled into view</div>
      <div class="ln">body of file-09.txt</div>
    </div>
  </div>
</body>
</html>
