<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=412, initial-scale=1.0" />
  <title>PocketShell · File viewer tabs</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="standalone">
  <div class="frame">
    <div class="statusbar">
      <span>9:42</span>
      <span class="right">5G · 87%</span>
    </div>
    <div class="breadcrumb">
      <div class="back">‹</div>
      <span class="crumb current">src/App.kt</span>
      <div class="more">⋮</div>
    </div>
    <div class="file-tab-row">
      <div class="file-tab active">
        <span>📄</span>
        <span class="tab-label">src/App.kt</span>
        <span class="tab-x">×</span>
      </div>
      <div class="file-tab">
        <span>📄</span>
        <span class="tab-label">test/App.kt</span>
        <span class="tab-x">×</span>
      </div>
      <div class="file-tab">
        <span>🖼</span>
        <span class="tab-label">very-long-screenshot-name.png</span>
        <span class="tab-x">×</span>
      </div>
    </div>
    <div class="file-viewer-body">
      <div class="ln"><span class="keyword">fun</span> <span class="accent">main</span>() {</div>
      <div class="ln">  println(<span class="string">"PocketShell tabs"</span>)</div>
      <div class="ln">}</div>
    </div>
  </div>
</body>
</html>
