name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # Issue #2356 (Phase 4 of epic #2350): FULL history + tags. Both this
      # job's "Generate version" step and app/build.gradle.kts's own
      # versionCode/versionName derivation (scripts/derive-version.sh) need
      # `git tag --list 'v*' --merged HEAD` / `git describe` to see every
      # prior release tag, not just the one commit a shallow checkout would
      # fetch — a shallow checkout here would silently undercount tags and
      # produce a WRONG (non-monotonic) versionCode for the real release APK.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Issue #2356: reuse the SAME derivation app/build.gradle.kts uses
      # (scripts/derive-version.sh) for the artifact filename, rather than a
      # second independently-written "dev-<timestamp>-<sha>" scheme, so the
      # uploaded APK filename always matches the version baked into the APK
      # itself.
      - name: Generate version
        id: version
        run: |
          chmod +x scripts/derive-version.sh
          VERSION="$(scripts/derive-version.sh version-name)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Issue #2570: a plain assemble. This used to run through
      # scripts/ci-assemble-with-ndk-retry.sh, which cleared a partial NDK
      # download and retried when Gradle's on-demand NDK install produced a
      # corrupt archive (#1581). #2566 deleted the last `externalNativeBuild`
      # in the build, so no NDK is ever downloaded and the wrapper was dead
      # weight; scripts/check-no-native-build.sh keeps it that way.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app2/build/outputs/apk/debug/app2-debug.apk "app2/build/outputs/apk/debug/pocketshell-${VERSION}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketshell-${{ steps.version.outputs.version }}-debug.apk
          path: app2/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Issue #2638: a RELEASE-signed APK alongside the debug one, signed by
      # the dedicated release keystore delivered through the four
      # ANDROID_RELEASE_* secrets (app2/build.gradle.kts resolves them; no
      # keystore is ever committed to the repo). Because the signatures
      # differ, the release APK carries applicationIdSuffix ".release" and
      # installs side by side with the debug build.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Rename release APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app2/build/outputs/apk/release/app2-release.apk "app2/build/outputs/apk/release/pocketshell-${VERSION}-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketshell-${{ steps.version.outputs.version }}-release.apk
          path: app2/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app2/build/outputs/apk/debug/*.apk
            app2/build/outputs/apk/release/*.apk
          generate_release_notes: true

  publish-pypi:
    # Build and publish the `pocketshell` Python package alongside the APK
    # release. Only fires on tag pushes; workflow_dispatch builds are
    # APK-only (matching the existing `Create Release` gate above).
    name: Publish pocketshell to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: pypi
      url: https://pypi.org/p/pocketshell

    steps:
      # Issue #2356: full tag history — the stamp step below and
      # scripts/check-pypi-version.sh both call scripts/derive-version.sh,
      # which needs the tag object (and, for versionCode-adjacent checks,
      # prior tags) reachable in this checkout.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Issue #2356 (Phase 4 of epic #2350): the committed
      # tools/pocketshell/pyproject.toml `version` is a placeholder (see the
      # comment in that file) — never published as-is. Stamp the REAL,
      # tag-derived version into this ephemeral checkout only (never
      # committed back) from the SAME script app/build.gradle.kts uses, so
      # both sides can never independently drift (scripts/check-version-
      # coupling.sh enforces this structurally at PR time).
      - name: Stamp pyproject.toml version from tag
        run: |
          chmod +x scripts/derive-version.sh
          DERIVED_VERSION="$(scripts/derive-version.sh version-name --ref "${{ github.ref_name }}")"
          echo "Stamping tools/pocketshell/pyproject.toml version = ${DERIVED_VERSION}"
          sed -i "0,/^version = \".*\"/s//version = \"${DERIVED_VERSION}\"/" tools/pocketshell/pyproject.toml
          grep -m1 '^version = ' tools/pocketshell/pyproject.toml

      - name: Verify stamped pyproject.toml version matches the tag
        # Hard cut (D22): publish must abort if the derivation/stamp step
        # ever diverges from the tag being published.
        run: |
          chmod +x scripts/check-pypi-version.sh
          scripts/check-pypi-version.sh --check-tag "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        working-directory: tools/pocketshell
        run: python -m build

      - name: Upload built distributions as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pocketshell-pypi-${{ github.ref_name }}
          path: tools/pocketshell/dist/*
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/pocketshell/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
