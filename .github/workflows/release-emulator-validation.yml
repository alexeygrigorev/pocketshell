name: Release Emulator Validation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional artifact run id suffix. Leave blank for timestamp.
        required: false
        type: string
      # Issue #2481: the `terminal_release_gate` input is gone with the stage
      # it toggled. scripts/release-emulator-validation.sh's
      # TERMINAL_RELEASE_GATE branch drove scripts/terminal-workbench.sh and
      # com.pocketshell.app.proof.RealAgentReleaseGateTest, both deleted with
      # the `app` module. app2 has no real-agent CLI surface — agent awareness
      # is a cut feature (docs/rewrite-implementation-plan.md "Scope
      # amendment") — so there is nothing to repoint it at.
      # Issue #2379 / decision D37: there is deliberately NO input here that
      # waives the nightly-fault release guard. A red / stale / cancelled /
      # missing fault-injection safety verdict on the release commit blocks the
      # gate, full stop — fix the failing test/journey, or quarantine that class
      # through the D36(4) flake mechanism. Re-adding one fails
      # scripts/check-release-gate-bypass-absent.sh in the Unit lane.

  # Issue #2356 (Phase 4 of epic #2350): the "validated RC" nightly trigger.
  # Rather than a SEPARATE `schedule:` cron re-deriving "the newest main SHA
  # with a green Phase-1 scheduled full-suite run" from scratch (a second
  # query racing the first), this workflow reacts to that exact signal --
  # `workflow_run` fires once .github/workflows/tests.yml's OWN `schedule:`
  # run (issue #2353's ~8h full-suite cadence) concludes, and the
  # `emulator-release-validation` job below only actually runs when that run
  # was itself green (see its `if:`). This is simpler and more reliable than
  # a second cron: one signal, one reaction, no clock-skew between two
  # independent schedules, and `github.event.workflow_run.head_sha` gives the
  # EXACT validated SHA directly instead of re-querying for it.
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

# Manual release validation owns a long emulator runner; queue one per ref
# instead of letting duplicate dispatches pile up. The nightly workflow_run
# trigger shares the same group (github.ref here is this workflow's own
# ref, effectively `main`), so a manual dispatch and the nightly run never
# overlap on the one long-lived emulator runner either.
concurrency:
  group: release-emulator-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-release-validation:
    name: Emulator-only release validation
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # Issue #2356: only run automatically for a GREEN scheduled Tests run
    # (the Phase-1 tier-3 full-suite cadence) -- never for a push/PR/red
    # Tests completion, which is not the "validated RC" signal this trigger
    # exists to react to. A manual workflow_dispatch always runs (unchanged
    # from before this issue).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.conclusion == 'success')

    # Issue #851: the nightly-fault release guard queries the latest "Nightly
    # Extensive Tests" run via `gh run list` / `gh run view`, which needs read
    # access to the Actions API.
    permissions:
      contents: read
      actions: read

    env:
      ANDROID_SDK: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_VALIDATION_SKIP_MAIN_GUARD: "1"
      POCKETSHELL_TEST_MEM: "8G"
      # Issue #1724: the confidence gate used to start compileDebugKotlin and
      # compileReleaseKotlin together on the hosted runner. The Kotlin daemon's
      # inherited 2 GiB heap then exhausted itself lowering the large
      # TmuxSessionViewModel before any emulator journey ran. Keep this scoped
      # to the hosted fallback: serialize Gradle work, leave a small launcher
      # heap, and give the compiler enough room inside cgroup-run.sh's 8 GiB
      # build scope. Local release validation retains its default two workers.
      GRADLE_FLAGS: >-
        --no-daemon
        --no-build-cache
        --no-parallel
        --max-workers=1
        -Dorg.gradle.jvmargs=-Xmx1536m
        -Pkotlin.daemon.jvmargs=-Xmx3072m

    steps:
      # Issue #2356: on the nightly workflow_run trigger, check out the
      # EXACT SHA the green Tests run validated
      # (github.event.workflow_run.head_sha), not whatever `main` has moved
      # to since -- the validated-rc marker recorded at the end of this run
      # must name the SHA this run actually exercised. On workflow_dispatch
      # that expression is empty, so actions/checkout falls back to its
      # normal default ref (unchanged from before this issue).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make scripts executable
        run: chmod +x ./gradlew scripts/*.sh

      - name: Verify Docker is available
        run: docker info

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Issue #2055: a local release needs 24 GiB of headroom, while the standard
      # hosted image advertises a much smaller initial free-space envelope. The
      # emulator journey job has used this exact bounded reclaim since #760 and
      # measured 110134 MiB available afterwards (Tests run 31040932815). Remove
      # only preinstalled toolchains this workflow never consumes, preserve the
      # setup-java JDK, then drive the release entry point's REAL 24 GiB storage
      # preflight before android-emulator-runner allocates its ~7.3 GiB userdata
      # image. A runner image that can no longer satisfy the floor fails here as
      # explicit infra capacity, never as a later product/Gradle failure.
      - name: Establish hosted release storage contract
        run: |
          set -uo pipefail
          echo "::group::Disk before hosted release reclaim"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          if [[ -n "${AGENT_TOOLSDIRECTORY:-}" && -d "${AGENT_TOOLSDIRECTORY:-}" ]]; then
            keep_dir=""
            if [[ -n "${JAVA_HOME:-}" && "$JAVA_HOME" == "$AGENT_TOOLSDIRECTORY"/* ]]; then
              rel="${JAVA_HOME#"$AGENT_TOOLSDIRECTORY"/}"
              keep_dir="${rel%%/*}"
            fi
            echo "Pruning $AGENT_TOOLSDIRECTORY, keeping active JDK dir: '${keep_dir:-<none>}'"
            if [[ -n "$keep_dir" ]]; then
              sudo find "$AGENT_TOOLSDIRECTORY" -mindepth 1 -maxdepth 1 \
                ! -name "$keep_dir" -exec rm -rf {} + || true
            else
              echo "JAVA_HOME not under \$AGENT_TOOLSDIRECTORY; leaving tool cache intact."
            fi
          fi
          sudo docker image prune -af || true
          echo "::group::Disk after hosted release reclaim"
          df -h /
          echo "::endgroup::"
          if [[ -n "${JAVA_HOME:-}" && ! -x "$JAVA_HOME/bin/java" ]]; then
            echo "::error title=RELEASE INFRA UNAVAILABLE::JAVA_HOME=$JAVA_HOME has no bin/java after hosted storage reclaim."
            exit 1
          fi
          scripts/release-emulator-validation.sh --check-storage

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare release validation run id
        id: validation
        env:
          RUN_ID_INPUT: ${{ inputs.run_id }}
        run: |
          if [[ -n "$RUN_ID_INPUT" ]]; then
            RUN_ID="$(printf '%s' "$RUN_ID_INPUT" | tr -cs 'A-Za-z0-9._-' '-')"
            RUN_ID="${RUN_ID#-}"
            RUN_ID="${RUN_ID%-}"
          else
            RUN_ID="gha-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-$(date +'%Y%m%d-%H%M%S')"
          fi
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="gha-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-$(date +'%Y%m%d-%H%M%S')"
          fi
          source scripts/lib/release-validation-storage.sh
          if ! pocketshell_release_validation_require_run_id "$RUN_ID"; then
            echo "::error title=INVALID RELEASE RUN ID::The sanitized run id collides with release-storage control state."
            exit "$POCKETSHELL_RELEASE_DISK_PREFLIGHT_FAIL_RC"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore test-execution ledger (#2082)
        uses: actions/cache@v5
        with:
          path: build/test-execution-ledger.tsv
          key: test-execution-ledger-${{ runner.os }}-${{ github.sha }}-release-${{ github.run_attempt }}
          restore-keys: |
            test-execution-ledger-${{ runner.os }}-

      - name: Run emulator-only release validation
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          RUN_ID: ${{ steps.validation.outputs.run_id }}
          ANDROID_SDK: ${{ env.ANDROID_SDK }}
          ADB: ${{ env.ANDROID_SDK }}/platform-tools/adb
          EMULATOR: ${{ env.ANDROID_SDK }}/emulator/emulator
          RELEASE_VALIDATION_SKIP_MAIN_GUARD: ${{ env.RELEASE_VALIDATION_SKIP_MAIN_GUARD }}
          # Issue #851: `gh` auth for the nightly-fault release guard.
          GH_TOKEN: ${{ github.token }}
        with:
          # API 35 (Android 15): match the maintainer's dogfood device and the
          # per-push emulator jobs (#1197). nightly-extensive.yml already boots
          # this exact image on this action.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # Issue #449: pin a GL-robust boot config explicitly instead of
          # relying on the action defaults. swiftshader_indirect is the
          # software GL path the pre-release confidence gate already uses for
          # its own managed-emulator starts, and a longer boot timeout gives a
          # cold runner more slack before the first instrumentation. If a boot
          # still loses GL init ('Failed to initialize 101010-2 format' ->
          # "No compose hierarchies found"), the gate cold-reboots the emulator
          # in-script and retries the affected selector on a fresh EGL surface.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: scripts/release-emulator-validation.sh

      - name: Record and verify execution ledger (#2082)
        if: always()
        run: |
          set -euo pipefail
          # Issue #2435: this step must NOT decide "did the run produce XML?"
          # through a pipeline. The previous shape was
          #   if ! find "$stage" -type f -name '*.xml' | grep -q .; then
          # and `grep -q` exits on its FIRST match, so `find` — which by then
          # has more than a pipe buffer of paths still to write — dies of
          # SIGPIPE/EPIPE, and `set -o pipefail` propagates find's non-zero
          # status. The check therefore reported "empty" EXACTLY when results
          # were present: run 33339283443 concluded `failure` on a validation
          # whose own summary.md said `Automated status: PASS`, which made the
          # #2356 `Record validated-rc marker` job (gated on
          # `result == 'success'`) unreachable. Count the staged files in the
          # shell instead — no pipe, so no exit status to launder.
          #
          # The copy also preserves the source tree rather than flattening into
          # one directory: `TEST-<class>.xml` is emitted per variant/module, and
          # flattening silently overwrote same-named results before they could
          # be counted. check-test-execution-ledger.sh --record walks the tree.
          stage="${RUNNER_TEMP}/release-ledger-results"
          scan="${RUNNER_TEMP}/release-ledger-xml.list"
          rm -rf -- "$stage"
          mkdir -p "$stage" build
          # Scan to a file, not through a pipe, so `find`'s own exit status is
          # observable rather than swallowed or laundered.
          scan_status=0
          find . \( -path '*/build/test-results/*' -o -path '*/build/outputs/androidTest-results/*' \) \
            -type f -name '*.xml' -print0 > "$scan" || scan_status=$?
          if [[ "$scan_status" -ne 0 ]]; then
            # Not fatal by itself: an under-collected scan shows up downstream as
            # classes the ledger cannot credit, and --verify is exactly the guard
            # that fails on that. Say so loudly instead of inventing a second,
            # hair-trigger release blocker.
            echo "::warning title=Test-execution ledger (issue #2082)::the JUnit XML scan exited $scan_status; the staged result set may be incomplete and --verify below is the backstop"
          fi
          staged=0
          while IFS= read -r -d '' xml; do
            dest="$stage/${xml#./}"
            mkdir -p "${dest%/*}"
            cp -p -- "$xml" "$dest"
            staged=$((staged + 1))
          done < "$scan"
          echo "staged $staged JUnit XML file(s) under $stage (scan exit $scan_status)"
          if [[ "$staged" -eq 0 ]]; then
            echo "::error title=Test-execution ledger (issue #2082)::no JUnit XML from the release run — refusing to record or verify"
            exit 1
          fi
          # --record is the CONTENT gate: it refuses a results root whose XML
          # contains no testcases, so a non-empty-but-vacuous stage cannot pass
          # for evidence just because files exist.
          scripts/check-test-execution-ledger.sh --record "$stage" --tier release
          # unit-debug,unit-release,androidTest: integrationTest has its own
          # #2094 execution guard and is not produced by this run or the rolling
          # unit/nightly cache.
          #
          # `unit-debug,unit-release` is the SAME class set as the plain `unit`
          # token — is_unit_debug_source_set (test|testDebug) unioned with
          # is_unit_release_source_set (test|testRelease) is exactly
          # is_unit_source_set — MINUS `*RealLlmTest`, via the ledger's existing
          # ordinary_unit_class_selected predicate. That subtraction is not a
          # weakening: app/build.gradle.kts excludes `**/*RealLlmTest.class` from
          # BOTH testDebugUnitTest and testReleaseUnitTest, and the only task
          # that can emit them (:app:realLlmTest) needs real provider
          # credentials from a repo-root .env that no runner has. Demanding a
          # 7-day cadence for evidence CI structurally cannot produce made the
          # release job unconditionally red on
          # AssistantAgentLoopRealLlmTest (#2435). The class stays registered,
          # and both unit lanes already apply this identical carve-out.
          scripts/check-test-execution-ledger.sh --verify --max-age-days 7 --source-set unit-debug,unit-release,androidTest

      - name: Publish validation summary
        if: always()
        run: |
          summary="build/release-emulator-validation/${{ steps.validation.outputs.run_id }}/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# PocketShell Release Emulator Validation"
              echo
              echo "No release validation summary was written."
              echo
              echo "Expected: \`$summary\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-emulator-validation-${{ steps.validation.outputs.run_id }}
          path: |
            build/release-emulator-validation/${{ steps.validation.outputs.run_id }}/
            build/pre-release-confidence-gate/${{ steps.validation.outputs.run_id }}-pre-release/
            !build/pre-release-confidence-gate/${{ steps.validation.outputs.run_id }}-pre-release/worktree/
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
            **/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore

      - name: Stop Docker targets
        if: always()
        run: |
          docker compose -f tests/docker/docker-compose.yml down --volumes --remove-orphans
          docker compose -f tests/docker/real-agent/compose.yml down --volumes --remove-orphans || true

  # Issue #2356 (Phase 4 of epic #2350), Part A step 2: on a GREEN nightly
  # run only, record the "validated RC" marker -- see
  # scripts/ci-nightly-rc-mark.sh for why a force-updated annotated
  # `validated-rc` git tag is the chosen mechanism (one command to query,
  # SHA + run URL + timestamp in the tag message, unambiguous by
  # construction since there is only ever one). Restricted to the
  # workflow_run/schedule path (never a manual workflow_dispatch) so an
  # ad-hoc manual run of this workflow against an arbitrary ref can never
  # move the release-readiness pointer.
  record-validated-rc:
    name: Record validated-rc marker
    needs: emulator-release-validation
    if: >-
      needs.emulator-release-validation.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Record validated-rc marker
        run: |
          chmod +x scripts/ci-nightly-rc-mark.sh
          scripts/ci-nightly-rc-mark.sh \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --trigger-run-url "${{ github.event.workflow_run.html_url }}"

  # Issue #2356, Part A step 3: on TWO CONSECUTIVE infra failures of the
  # nightly run (never a single flaky blip), auto-file/update ONE tracking
  # issue -- mirrors the pattern .github/workflows/full-suite-notify.yml
  # already established for the scheduled-full-suite red-run tracker
  # (issue #2353). Also restricted to the workflow_run/schedule path.
  notify-nightly-rc-red:
    name: File/update red nightly-RC tracking issue
    needs: emulator-release-validation
    if: >-
      needs.emulator-release-validation.result == 'failure' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - id: streak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-nightly-rc-consecutive-check.sh
          scripts/ci-nightly-rc-consecutive-check.sh \
            --repo "${{ github.repository }}" \
            --exclude-run-id "${{ github.run_id }}"

      - name: File or update the tracking issue on a two-in-a-row streak
        if: steps.streak.outputs.consecutive_failures == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-nightly-rc-issue.sh
          scripts/ci-nightly-rc-issue.sh \
            --repo "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --trigger-run-url "${{ github.event.workflow_run.html_url }}" \
            --sha "${{ github.event.workflow_run.head_sha }}"
