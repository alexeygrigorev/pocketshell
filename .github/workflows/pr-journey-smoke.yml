name: PR journey smoke

# Issue #2354 (Phase 2 of epic #2350): per-PR scoped journey smoke.
#
# The v0.4.45 postmortem (#2350): the load-bearing emulator journey suite only
# ran BATCHED on `main` after merge, so a bad commit (#2294, which broke
# terminal-attach on the 2nd MainActivity launch across 15 journey classes —
# #2338) landed cleanly and its evidence arrived hours later, already on
# `main`. This workflow closes that gap for the highest-value slice: a SINGLE,
# fast (target <=20 min) emulator run of a small FIXED set of the most
# load-bearing journey classes, gated so it only runs on PRs whose diff maps
# (via scripts/select-test-areas.sh, #2063/#2353) to the connection/terminal/
# session/composer areas most likely to reintroduce that class of break.
#
# Deliberately a SEPARATE workflow file, not a job inside tests.yml:
# tests.yml is under a hard file-size ratchet
# (scripts/check-file-size-hygiene.sh) with very little headroom (~1 KB at
# the time this was added), the same reason full-suite-notify.yml was split
# out in #2353. This job also needs none of tests.yml's `needs:`/matrix
# wiring — it is a standalone plan -> smoke -> gate chain.
#
# Kept intentionally MUCH smaller than tests.yml's `emulator-journey` job: one
# runner (no 6-way shard matrix), one Docker fixture (the plain `agents`
# service on 2222 — none of the 3 smoke classes touch the old-CLI/daemon/
# network-fault/mobile-RTT fixtures), one emulator-runner attempt (no
# cold-boot retry/classify/aggregate machinery — a real failure or infra
# flake here just fails the PR check; a human/CI re-run recovers a flake, the
# same way the required `Unit tests`/`Python utility tests` checks already
# work). scripts/pr-journey-smoke-plan.sh and scripts/ci-journey-suite.sh do
# the real work; this file is wiring.
#
# TRIGGER SHAPE — DELIBERATELY NO trigger-level `paths-ignore` (round-2 fix,
# reviewer finding on issue #2354). An earlier version gated the whole
# `on: pull_request:` block with `paths-ignore: [**/*.md, docs/**, chat/**]`,
# so a docs-only PR never triggered this workflow AT ALL — no run, no check
# entry. That is fine while this workflow is advisory (today), but is an
# active footgun the moment it is ever registered as a REQUIRED status check:
# GitHub would show the required context as "Expected" FOREVER for such a PR,
# since no workflow run ever reports it, with no admin bypass short of
# disabling the requirement. The safe pattern — the one `plan`'s own
# `should_run` gate already uses correctly — is job-level `if:`, because a job
# skipped via `if:` reports `skipped`, and GitHub treats `skipped` as
# satisfying a required check. So EVERY PR triggers this workflow; `plan`
# always runs (cheap, no JDK/emulator); `smoke` is gated entirely by
# `needs.plan`'s output; and `gate` (below) always runs and is the stable,
# always-present check name safe to register as required in the future.

on:
  pull_request:

concurrency:
  group: pr-journey-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Cheap (no JDK, no emulator): decide whether this diff needs the smoke
  # job at all. scripts/pr-journey-smoke-plan.sh's own fail-safes (MODE=full
  # on an unmapped/unreadable diff, fail-open if select-test-areas.sh itself
  # errors) mean this job can only ever OVER-select, never silently
  # under-select. Runs on EVERY PR (docs-only included) — this is where the
  # docs/python-only-PR-skip decision now lives, entirely job-level.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      smoke_classes: ${{ steps.plan.outputs.smoke_classes }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      # Wired HERE (not tests.yml, which has ~1 KB of file-size-ratchet
      # headroom) so the gating logic's own self-test runs on every PR, not
      # only PRs that happen to touch this workflow file. Self-test:
      # scripts/test-pr-journey-smoke-plan.sh.
      - name: Self-test the smoke-gating logic
        run: |
          chmod +x scripts/test-pr-journey-smoke-plan.sh
          scripts/test-pr-journey-smoke-plan.sh

      - id: plan
        run: |
          chmod +x scripts/pr-journey-smoke-plan.sh
          scripts/pr-journey-smoke-plan.sh --base "${{ github.event.pull_request.base.sha }}"

  smoke:
    name: Journey smoke (load-bearing subset)
    needs: plan
    # Only run when `plan` ITSELF succeeded AND said so. Without the
    # `needs.plan.result == 'success'` half, a FAILED `plan` (e.g. its
    # self-test reddens) would leave `should_run` unset/empty, this
    # condition would evaluate false, and `smoke` would report `skipped` —
    # which reads as "satisfied" to a required check despite `plan` having
    # actually failed. `gate` below re-derives this same three-way split
    # (success-and-ran / success-and-skipped / plan-failed) so a future
    # required-check registration cannot be fooled by it either.
    if: needs.plan.result == 'success' && needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Target is <=20 min (issue #2354). This cap leaves headroom for a cold
    # emulator boot (measured worst case ~900s / 15 min elsewhere in
    # tests.yml's emulator-journey job) plus the Gradle warm build plus 3
    # journey classes (~90s average / up to ~6 min worst-case each per the
    # measured range in scripts/ci-journey-shard-count.sh) without being so
    # generous that a genuine wedge burns the runner indefinitely.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew + suite script executable
        run: chmod +x ./gradlew scripts/ci-journey-suite.sh

      - name: Verify Docker is available
        run: docker info

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same rationale as tests.yml's emulator-journey job (#760/#771): the
      # hosted runner's disk pressure and stock sdkmanager can both fail the
      # AVD create before any test runs. Reusing the exact scripts keeps this
      # job's behavior identical to the batched job's, not a second copy that
      # can drift.
      - name: Free disk space for the AVD
        run: scripts/ci-emulator-free-disk.sh

      - name: Initialize journey setup artifacts
        run: mkdir -p artifacts/ci-journey-setup

      - name: Repair Android cmdline-tools + accept licenses (issue #771)
        run: scripts/ci-emulator-repair-sdk-tools.sh

      - name: Build SSH base image
        run: scripts/ci-journey-fixture-retry.sh sshd -- docker compose -f tests/docker/docker-compose.yml build sshd

      # None of the 3 smoke classes (Issue2338SecondLaunchTerminalAttach,
      # MultiSessionSwitch, ComposerAlwaysPresentSwitch) reference the
      # old-CLI/daemon/network-fault/mobile-RTT fixtures, so only the plain
      # deterministic `agents` fixture is needed here.
      - name: Start Docker fixture (agents)
        run: scripts/ci-journey-fixture-retry.sh agents -- docker compose -f tests/docker/docker-compose.yml up -d --build --no-deps agents

      - name: Wait for the agents fixture to report healthy
        run: |
          source tests/docker/lib/wait-for-healthy.sh
          wait_for_container_healthy tests/docker/docker-compose.yml agents /tmp/agents-health.log 60
          cat /tmp/agents-health.log

      - name: Run the load-bearing journey smoke subset
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          # Unsharded (POCKETSHELL_JOURNEY_CI_SHARD_TOTAL unset => the whole
          # registry), then intersected down to exactly the 3-class smoke set
          # by scripts/ci-journey-class-selection-functions.sh's existing
          # scoped-plan filter (issue #2353) — the same mechanism the
          # `main`-push `sg`/`emulator-journey` jobs use, reused rather than
          # reimplemented.
          POCKETSHELL_JOURNEY_SCOPED: ${{ needs.plan.outputs.smoke_classes }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 6144 -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: scripts/ci-journey-suite.sh

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p artifacts/docker
          docker compose -f tests/docker/docker-compose.yml ps > artifacts/docker/compose-ps.txt
          docker compose -f tests/docker/docker-compose.yml logs --no-color agents > artifacts/docker/agents.log 2>/dev/null || true

      - name: Upload journey smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-journey-smoke-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/outputs/connected_android_test_additional_output/
            artifacts/ci-journey/
            artifacts/ci-journey-attempt-1/
            artifacts/ci-journey-setup/
            artifacts/docker/
          overwrite: true
          if-no-files-found: ignore

      - name: Stop Docker fixture
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down --volumes --remove-orphans

  # ---------------------------------------------------------------------------
  # Stable, ALWAYS-runs aggregator — the check name safe to register as a
  # required status check (mirrors tests.yml's `unit-gate` pattern for the
  # identical reason: registering `smoke` itself as required would be fooled
  # by its own legitimate `if:`-skip on a non-load-bearing PR, exactly the
  # class of bug this job exists to close). `if: !cancelled()` (not
  # `always()`) so a genuinely cancelled run (e.g. superseded by a newer push
  # in the same concurrency group) reports `cancelled` rather than a false
  # green — see tests.yml's `unit-gate` comment for the full `always()` vs
  # `!cancelled()` vs `always() && !cancelled()` reasoning; the same three
  # traps apply here.
  gate:
    name: PR journey smoke
    needs: [plan, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require plan to succeed, and smoke to have run-and-succeeded or been legitimately skipped
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHOULD_RUN: ${{ needs.plan.outputs.should_run }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error title=PR journey smoke::plan job did not succeed (result=$PLAN_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" ]]; then
            if [[ "$SMOKE_RESULT" != "success" ]]; then
              echo "::error title=PR journey smoke::plan selected this PR for the smoke set (should_run=true) but smoke result=$SMOKE_RESULT."
              exit 1
            fi
            echo "OK: plan selected this PR, and smoke ran green."
          else
            if [[ "$SMOKE_RESULT" != "skipped" ]]; then
              echo "::error title=PR journey smoke::plan did NOT select this PR (should_run=false) but smoke result=$SMOKE_RESULT (expected skipped)."
              exit 1
            fi
            echo "OK: plan did not select this PR (docs-only / non-load-bearing area); smoke correctly skipped."
          fi
