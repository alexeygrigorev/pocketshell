<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=412, initial-scale=1.0" />
  <title>PocketShell · File viewer empty workspace</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="standalone">
  <div class="frame">
    <div class="statusbar">
      <span>9:42</span>
      <span class="right">5G · 87%</span>
    </div>
    <div class="breadcrumb">
      <div class="back">‹</div>
      <span class="crumb current">Open files</span>
      <div class="more">⋮</div>
    </div>
    <div class="file-empty">
      <div>No open files</div>
      <div class="sub">Browse the host or open a path to start a workspace.</div>
      <div class="cta">Browse files</div>
      <div class="cta secondary">Open path</div>
    </div>
  </div>
</body>
</html>
