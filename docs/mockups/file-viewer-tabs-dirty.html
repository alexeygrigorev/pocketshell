<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=412, initial-scale=1.0" />
  <title>PocketShell · File viewer dirty-work guard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="standalone">
  <div class="frame" style="position:relative">
    <div class="statusbar">
      <span>9:42</span>
      <span class="right">5G · 87%</span>
    </div>
    <div class="breadcrumb">
      <div class="back">‹</div>
      <span class="crumb current">notes.md</span>
      <div class="more">⋮</div>
    </div>
    <div class="file-tab-row">
      <div class="file-tab active"><span class="tab-label">notes.md</span><span class="tab-x">×</span></div>
      <div class="file-tab"><span class="tab-label">plan.md</span><span class="tab-x">×</span></div>
    </div>
    <div class="file-viewer-body">
      <div class="ln"># notes</div>
      <div class="ln dim">1  looks wrong</div>
    </div>
    <div class="dirty-sheet">
      <div style="font-weight:600;color:var(--text)">Unfinished work</div>
      <div style="margin-top:8px;color:var(--text-secondary);font-size:13px">
        Finish or discard work on /home/u/notes.md before switching
      </div>
      <div class="actions">
        <div class="cta">Stay</div>
        <div class="cta secondary">Submit</div>
        <div class="cta secondary">Discard and switch</div>
      </div>
    </div>
  </div>
</body>
</html>
