name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # Issue #2356 (Phase 4 of epic #2350): FULL history + tags. Both this
      # job's "Generate version" step and app/build.gradle.kts's own
      # versionCode/versionName derivation (scripts/derive-version.sh) need
      # `git tag --list 'v*' --merged HEAD` / `git describe` to see every
      # prior release tag, not just the one commit a shallow checkout would
      # fetch — a shallow checkout here would silently undercount tags and
      # produce a WRONG (non-monotonic) versionCode for the real release APK.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Issue #2356: reuse the SAME derivation app/build.gradle.kts uses
      # (scripts/derive-version.sh) for the artifact filename, rather than a
      # second independently-written "dev-<timestamp>-<sha>" scheme, so the
      # uploaded APK filename always matches the version baked into the APK
      # itself.
      - name: Generate version
        id: version
        run: |
          chmod +x scripts/derive-version.sh
          VERSION="$(scripts/derive-version.sh version-name)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Issue #2570: a plain assemble. This used to run through
      # scripts/ci-assemble-with-ndk-retry.sh, which cleared a partial NDK
      # download and retried when Gradle's on-demand NDK install produced a
      # corrupt archive (#1581). #2566 deleted the last `externalNativeBuild`
      # in the build, so no NDK is ever downloaded and the wrapper was dead
      # weight; scripts/check-no-native-build.sh keeps it that way.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app2/build/outputs/apk/debug/app2-debug.apk "app2/build/outputs/apk/debug/pocketshell-${VERSION}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketshell-${{ steps.version.outputs.version }}-debug.apk
          path: app2/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app2/build/outputs/apk/debug/*.apk
          generate_release_notes: true

  # The `publish-pypi` job was DELETED with its subject (issue #2643): the host
  # CLI (tools/pocketshell/) moved to PocketShell-io/pocketshell-cli and its
  # tag-driven PyPI publish, pyproject version stamp and check-pypi-version
  # guard run in that repo's own CI now. This workflow builds the APK only;
  # the app version still derives from the pushed tag alone
  # (scripts/derive-version.sh).
