[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketshell"
# PLACEHOLDER (issue #2356, Phase 4 of epic #2350): this value is NEVER read
# for a real release. The publish-pypi job in .github/workflows/build.yml
# overwrites this field (in its ephemeral CI checkout only, never committed)
# from `scripts/derive-version.sh version-name --ref <tag>` — the SAME
# derivation app/build.gradle.kts uses for the Android versionName — right
# before building the sdist/wheel, so both sides derive from the git tag
# being released and can never independently drift.
# scripts/check-pypi-version.sh enforces the stamped value matches the tag;
# scripts/check-version-coupling.sh enforces the derivation itself is
# single-sourced. See tools/pocketshell/README.md ("Version coupling").
version = "0.0.0"
description = "Unified server-side Python utility for the PocketShell Android client."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexey Grigorev" }]
license = { text = "MIT" }
keywords = ["pocketshell", "ssh", "agents", "usage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]
# `pocketshell usage` delegates to the `quse` CLI, which is now a PINNED
# hard dependency (issue #1318): quse owns the unified usage schema, so we
# ship a known-good quse WITH pocketshell and invoke that pinned console-
# script (next to `sys.executable`, never PATH — see `pocketshell/usage.py`
# `_resolve_quse_binary`). A host-level quse upgrade must not reach us.
dependencies = [
    "click>=8.2.0",
    # Usage backend + single source of truth for the unified provider schema
    # (issue #1318). Pinned exactly: `pocketshell usage --json` expects quse's
    # provider-keyed `--json` document and fails loudly on schema drift, so the
    # version is frozen, not a range. The published 0.0.15 wheel (upstream
    # a86959e, issue #2293) is the six-provider CANONICAL producer: every
    # record already carries the top-level `windows` map the Android parser
    # reads, so the host boundary only injects the provider key and forwards
    # the record unchanged. #2283's `short_term` / `long_term` translation for
    # the older wheel is hard-cut (D22) — a legacy-shaped record now fails
    # loudly. 0.0.15 is also the first published wheel that reports the `go`
    # provider (OpenCode on the Go backend), so the OpenCode Go quota finally
    # reaches the Usage panel; it is a provider of the pinned wheel, not a
    # separate producer contract. 0.0.13 (#2195) historically added the `grok`
    # provider; 0.0.11 (#1564) labeled each Codex window from its actual
    # `limit_window_seconds`.
    "quse==0.0.15",
    # FCM HTTP v1 push delivery (#690): service-account OAuth2 bearer minting
    # for `pocketshell push` / the `usage --capture` reset-push send. Imported
    # lazily and fail-soft — a host without it (or without a Firebase
    # credential) simply no-ops the send, so the lower bound is advisory.
    "google-auth>=2.0.0",
    # YAML serialization for `pocketshell profiles list` (#718) — the host's
    # human/agent-readable default output format (#714). The Android client
    # consumes the `--json` flag instead; the host-facing default is YAML.
    "pyyaml>=6.0",
    # aplexer ships WITH the pocketshell CLI (issue #2543). `pocketshell
    # sessions create` needs BOTH the `a` CLI and its
    # `aplexer` worker binary (aplexer/src/lib.rs::worker_executable resolves
    # the worker as a sibling of current_exe); the published wheel bundles
    # both native binaries and exposes them as the `a` / `aplexer`
    # console-scripts, so `uv tool install pocketshell` delivers a complete,
    # working aplexer with no separate build/copy/PATH step. That closes the
    # reported failure where a hand-installed `~/bin/a` was invisible to the
    # app's NON-INTERACTIVE SSH PATH and half-installed (no sibling worker).
    #
    # Pinned exactly, like `quse`: pocketshell speaks a specific `a --json`
    # contract (`start`/`snapshot`/`list`/`launch-spec`/`engines`/`profiles`),
    # and `pocketshell/aplexer.py` resolves the BUNDLED copy INSTEAD of PATH,
    # so the pinned wheel is the ONLY aplexer this CLI can run. Bumping the
    # pin is a deliberate, reviewed change.
    #
    # 0.1.5 is required for PocketShell's plain attach path. `a attach
    # --no-status` removes aplexer's status chrome and reserved row while
    # forwarding raw input and every PTY resize, so the Android terminal gets
    # the full screen without a second terminal UI. 0.1.4 is also required
    # for the session tree to say WHICH agent is running. Through 0.1.3 a
    # snapshot row's only agent-ish field was `engine`, and
    # `engine` cannot answer that question: every session PocketShell creates
    # is `engine: "shell"` with the agent launched by hand inside it, so a
    # tree full of claude/codex/opencode sessions is indistinguishable from a
    # tree full of bare shells. 0.1.4 derives an `agent` field at QUERY time
    # by walking the workload's descendant process tree (`workload_pid` plus
    # `/proc/<pid>/task/*/children`, the same walk containment already uses)
    # and classifying each `comm`/`cmdline` by whole-word command token —
    # aplexer ca56fa5, spec.md section 18. It is present on every
    # `a list --json` / `a snapshot` row (`null` when nothing recognisable is
    # running) and never persisted, so it cannot go stale.
    #
    # `session_enum._aplexer_rows` reads that key straight onto
    # `LiveSession.agent` and schema 3 emits it on every row. Against 0.1.3
    # the key is simply absent and every row reports `agent: null` — the
    # listing still works, it just cannot name an agent, which is the whole
    # point of the bump. tests/test_aplexer_contract.py pins the behaviour
    # against the bundled binary: a real session running a process named
    # `claude` reports `agent == "claude"`, and `null` again once it exits.
    # Verified red on published 0.1.3 (no `agent` key at all), green on 0.1.4.
    #
    # 0.1.3 is required for a USER-VISIBLE session-tree defect, not for
    # version hygiene (aplexer#2 / aplexer#3). Through 0.1.2, aplexer's
    # `list_records` treated a session directory containing no `session.json`
    # as a CORRUPT REGISTRY and failed the entire scan:
    #
    #     a: load session registry entry <dir>: read <dir>/session.json:
    #     No such file or directory (os error 2)          exit=1
    #
    # But `start_session` creates that directory 26-43 ms BEFORE it writes the
    # record, on every single `a start`. The window is therefore on the normal
    # create path, and every reader that does not hold the registry lock can
    # land in it — which is every reader PocketShell has. `a watch` died on it
    # (1 run in 60 on an idle box) and `a list` was bricked outright for the
    # duration.
    #
    # That reaches the phone directly. `session_enum.py::_probe_aplexer` and
    # `sessions.py::_aplexer_snapshot` both probe `a --json snapshot` and fall
    # back to `a --json list`; the fallback cannot help, because the failure
    # is in the shared registry scan underneath both. `aplexer.run_json`
    # collapses any failure to None, so while a session was being created the
    # session tree silently lost EVERY aplexer row. Worse, a record-less
    # directory that outlives the window (a killed/crashed `a start`) bricks
    # 0.1.2's registry permanently — including `a start` itself, which runs
    # the same scan under the lock, so `sessions create`
    # stops working until someone manually `rmdir`s it.
    # tests/test_aplexer_contract.py drives the bundled binary through both
    # production probes with exactly that on-disk shape; verified red on
    # published 0.1.2, green on 0.1.3.
    #
    # 0.1.2 (not 0.1.1) was the previous floor, and the version string alone
    # could not tell you why: aplexer HEAD sat 143 commits past the v0.1.1 tag
    # while STILL self-reporting `a --version` as 0.1.1, so the published
    # 0.1.1 wheel and the build every PocketShell host actually ran were
    # indistinguishable by version. Pinning 0.1.1 under the hard cut would
    # have silently DOWNGRADED every host to a build missing two fixes the
    # real create-agent path needs:
    #   * aplexer ee4b957 — profile `executable` override (argv[0]) for Codex
    #     variants. Without it, `[profiles.zcodex] engine="codex",
    #     executable="zcodex"` resolves argv[0] to `codex`, and `pocketshell
    #     sessions create --engine codex --profile zcodex`
    #     dies with "a: command is not executable or was not found in PATH:
    #     codex".
    #   * aplexer d13ecb2 — preserve the provider environment for plain
    #     `shell` launches (0.1.1 stripped 71 provider vars from every shell
    #     session).
    # tests/test_aplexer_contract.py pins ALL of these behaviours against the
    # BUNDLED binary, because `a --version` demonstrably cannot: a future pin
    # that regresses to a build without them fails that test loudly instead
    # of shipping a silent downgrade. Re-run it whenever this pin moves.
    #
    # There is no separate release-time guard for the aplexer version itself
    # (scripts/check-pypi-version.sh only couples pocketshell's OWN version to
    # the release tag and says nothing about quse either), so the
    # exact pin + the committed uv.lock + that contract test are the
    # enforcement.
    #
    # The `sys_platform == 'linux'` marker is load-bearing: aplexer publishes
    # manylinux wheels only (x86_64 + aarch64) and NO sdist, so an unmarked
    # hard dependency would make `pip install pocketshell` unresolvable on
    # macOS/Windows. PocketShell hosts are Linux; a non-Linux host simply gets
    # no bundled aplexer at all, so `sessions create` there fails loud (there
    # is no PATH fallback — D22).
    #
    # Install-surface note (unchanged in 0.1.5): as of 0.1.2 the wheels moved
    # from manylinux_2_17 to manylinux_2_28, raising the minimum glibc from
    # 2.17 to 2.28. Linux hosts older than that (CentOS 7, Ubuntu 18.04) can
    # no longer install pocketshell at all now that aplexer is a hard
    # dependency. Flagged, not solved here — see docs/aplexer-integration.md.
    "aplexer==0.1.5; sys_platform == 'linux'",
]

[project.scripts]
pocketshell = "pocketshell.cli:main"

[project.urls]
Homepage = "https://github.com/alexeygrigorev/pocketshell"
Issues = "https://github.com/alexeygrigorev/pocketshell/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.15.0",
]

[project.optional-dependencies]
# Mirror of the dev `dependency-groups` so `pip install -e ".[dev]"` and
# `uv pip install -e ".[dev]"` both work for CI and ad-hoc local setups.
# `uv sync --group dev` reads `dependency-groups`; PEP-621 tooling reads
# `optional-dependencies`. Keeping both in lock-step is cheap.
dev = [
    "pytest>=8.4.0",
    "ruff>=0.15.0",
]
# Optional extra for `pocketshell qr-share`. The `qrcode[pil]` chain is
# heavy (Pillow) and is only needed for QR rendering, so we keep it out
# of the default install. Without this extra, `pocketshell qr-share`
# exits 127 with a friendly install hint; every other subcommand keeps
# working unchanged. Install with `pip install pocketshell[qr]` or
# `uv tool install pocketshell --with qrcode[pil]`.
qr = [
    "qrcode[pil]>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pocketshell"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
]

[tool.uv]
# CI and local frozen-sync checks use the same installer semantics. Bump this
# deliberately together with .github/workflows/tests.yml and validate the
# committed lock before merging.
required-version = "==0.10.11"
# Keep the lockfile's reproducibility cutoff project-local. The host may have
# a rolling global `exclude-newer` policy that predates deliberately pinned
# release (quse 0.0.15); this exact value is also the
# `uv.lock` options cutoff and must be used when checking this lock. Moved
# past quse 0.0.15's 2026-08-28T12:09:07Z PyPI upload for issue #2293, then
# past aplexer 0.1.2's 2026-09-05T22:38:08Z PyPI upload (its `aplexer-client`
# runtime dep landed at 22:38:04Z) for issue #2543. A package uploaded after
# the cutoff is simply invisible to `uv lock`, which reads like a broken index
# rather than a stale cutoff, so this value moves in lock-step with every new
# pin — and the `uv.lock` options cutoff must be moved to match. Now past
# aplexer 0.1.3's 2026-09-06T00:32:09Z PyPI upload (its `aplexer-client`
# runtime dep landed at 00:32:04Z) for the session-tree regression fix above,
# and now past aplexer 0.1.4's 2026-09-06T16:14:52Z PyPI upload (its
# `aplexer-client` runtime dep landed at 16:14:48Z) for the `agent` field.
# 0.1.5 uploaded at 21:06:11Z (client at 21:06:06Z) for plain attach.
exclude-newer = "2026-09-08T22:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
